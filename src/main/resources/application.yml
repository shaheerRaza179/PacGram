spring:
  application:
    name: pacgram
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:64523;databaseName=pacgram;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:pacgram}
    password: ${DB_PASSWORD:pacsquare}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 65MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    throw-exception-if-no-handler-found: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

pacgram:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT24H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    location: ${UPLOAD_DIR:./uploads}
    report-evidence-location: ${REPORT_EVIDENCE_DIR:./private-report-evidence}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  swagger:
    auto-open: ${SWAGGER_AUTO_OPEN:true}
  admin:
    username: ${PACGRAM_ADMIN_USERNAME:pacadmin}
    password: ${PACGRAM_ADMIN_PASSWORD:}

logging:
  level:
    root: WARN
    com.pacgram: INFO